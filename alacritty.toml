[general]
import = ["~/.cache/wal/colors-alacritty.toml"]

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[font]
size = 10.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[selection]
save_to_clipboard = true

[window]
opacity = 0.8

[window.padding]
x = 0
y = 0
[colors.primary]
background = "#24273a"
foreground = "#cad3f5"
[colors.cursor]
text = "#24273a"
cursor = "#b7bdf8"
[colors.normal]
black = "#494d64"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#c6a0f6"
cyan = "#8bd5ca"
white = "#b8c0e0"
[colors.bright]
black = "#5b6078"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#c6a0f6"
cyan = "#8bd5ca"
white = "#a5adcb"
[colors.selection]
text = "#cad3f5"
background = "#363a4f"

[terminal.shell]
program = "fish"
